# ==============================================================================
# BeesHub Farmland - Production Nginx Virtual Host Configuration
# Zero-Downtime Blue-Green Architecture with Cumulative Static Asset Caching
# Target Path on Server: /etc/nginx/sites-available/beeshubfarmland.conf
# ==============================================================================

# Include active upstream (points to either 127.0.0.1:3001 or 127.0.0.1:3002)
include /var/www/beeshub/deployment/nginx/upstream.conf;

# Rate limiting zone for public APIs & form submissions
limit_req_zone $binary_remote_addr zone=beeshub_limit:10m rate=15r/s;

# HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name beeshubfarmland.com www.beeshubfarmland.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beeshubfarmland.com www.beeshubfarmland.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/beeshubfarmland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beeshubfarmland.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max Upload Size (for product images & documents)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # =========================================================================
    # STATIC ASSET PROTECTION (SOLVES ALL CHUNK 404s ACROSS RELEASES)
    # Serves from shared cumulative cache so old browser sessions NEVER fail
    # =========================================================================
    location /_next/static/ {
        alias /var/www/beeshub/shared/static_cache/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ @backend;
    }

    # Public Directory Assets (Static images, logos, icons)
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        root /var/www/beeshub/current/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @backend;
    }

    # Persistent Customer / Product Uploads
    location /uploads/ {
        alias /var/www/beeshub/shared/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js Image Optimization API
    location /_next/image {
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Webhook & Rate Limited Routes
    location /api/wholesale {
        limit_req zone=beeshub_limit burst=5 nodelay;
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # REVERSE PROXY TO ACTIVE BLUE / GREEN BACKEND
    # =========================================================================
    location / {
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keepalive & Timeout tuning
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Fallback to backend Node.js server if static file is missing
    location @backend {
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
