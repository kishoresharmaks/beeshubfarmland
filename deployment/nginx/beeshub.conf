# ==============================================================================
# BeesHub Farmland - Production Nginx Virtual Host Configuration
# Zero-Downtime Blue-Green Architecture with Cumulative Static Asset Caching
# Preserves all existing Certbot SSL certificates and server snippets
# ==============================================================================

# Include dynamic Blue/Green upstream (switches between 127.0.0.1:3001 and 127.0.0.1:3002)
include /var/www/beeshubfarmland/deployment/nginx/upstream.conf;

server {
    server_name beeshubfarmland.com www.beeshubfarmland.com;
    include /etc/nginx/snippets/custom-502.conf;

    # =========================================================================
    # STATIC ASSET PROTECTION (SOLVES ALL CHUNK 404s ACROSS RELEASES)
    # Serves from shared cumulative cache so old browser sessions NEVER fail
    # =========================================================================
    location /_next/static/ {
        alias /var/www/beeshubfarmland/shared/static_cache/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ @backend;
    }

    # Persistent Customer / Product Uploads
    location /uploads/ {
        alias /var/www/beeshubfarmland/shared/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js Image Optimization API
    location /_next/image {
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================================================
    # REVERSE PROXY TO ACTIVE BLUE / GREEN BACKEND
    # =========================================================================
    location / {
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keepalive & Timeout tuning
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fallback to Node.js backend if a static file is missing
    location @backend {
        proxy_pass http://beeshub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/beeshubfarmland.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beeshubfarmland.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.beeshubfarmland.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = beeshubfarmland.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name beeshubfarmland.com www.beeshubfarmland.com;
    return 404; # managed by Certbot
}
